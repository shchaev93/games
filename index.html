<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Игры для компании</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600&family=Oswald:wght@700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:#fff;--ink:#1d1214;--muted:#6d5a5c;--red:#d7262e;--line:#efd6d1;--paper:#fff3ef}
@media (prefers-color-scheme:dark){:root{--bg:#160c0e;--ink:#f6ecec;--muted:#b9a5a7;--line:#3d2529;--paper:#26171a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 'Golos Text',system-ui,sans-serif}
.top{background:var(--red);color:#fff;padding:40px max(5vw,16px) 36px}h1{font:700 clamp(36px,6vw,56px)/1.05 Oswald,sans-serif;margin:0}
.top p{margin:10px 0 0;opacity:.9}.list{max-width:900px;margin:0 auto;padding:28px max(5vw,16px);display:grid;gap:16px}
a.game{display:block;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px 24px;color:inherit;text-decoration:none}
a.game:hover{border-color:var(--red)}a.game h2{font:700 30px/1.1 Oswald,sans-serif;margin:0 0 6px}a.game p{margin:0;color:var(--muted)}
</style></head><body>
<header class="top"><h1>Игры для компании</h1><p>Играйте вместе на одном телефоне.</p></header>
<main class="list">
<a class="game" href="ugaday-film/"><h2>Угадай фильм</h2><p>Угадайте фильм по длительности, году и подсказкам-билетам. 159 фильмов: зарубежные, советские и российские.</p></a>
</main></body></html>
